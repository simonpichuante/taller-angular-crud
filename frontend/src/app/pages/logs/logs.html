<h1>Registro de eventos</h1>
<button (click)="servicio.limpiar()">Limpiar</button>
<div class="tabla">
  <table>
    <thead>
      <tr>
        <th>Hora</th>
        <th>Nivel</th>
        <th>Mensaje</th>
      </tr>
    </thead>
    <tbody>
      @for (log of servicio.logs(); track $index) {
        <tr>
          <td>{{ log.fecha | date: 'HH:mm:ss' }}</td>
          <td>{{ log.nivel }}</td>
          <td>{{ log.mensaje }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">No hay eventos.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
